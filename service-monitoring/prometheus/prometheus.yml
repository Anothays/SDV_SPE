global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'role-manager'
    static_configs:
      - targets: ['role-manager:8080']
        labels:
          application: 'role-manager'
    metrics_path: '/actuator/prometheus'
  - job_name: 'sso'
    static_configs:
      - targets: ['sso:8082']
        labels:
          application: 'sso'
    metrics_path: '/actuator/prometheus'
