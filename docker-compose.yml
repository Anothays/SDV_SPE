services:
  app:
    container_name: "app"
    build: service-profil
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/maBase
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: on-failure

  db-identite:
    image: postgres:16-alpine
    container_name: "db-identite"
    # wal_level=logical : requis par le connecteur Debezium (réplication logique
    # via le plugin pgoutput, natif depuis PG10, pas d'extension à installer).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: identite
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d identite"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring-net

  identite:
    container_name: "identite"
    build: service-identite
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-identite:5432/identite
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
    depends_on:
      db-identite:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: "db"
    # Binlog au format ROW : requis par le connecteur Debezium MySQL (CDC).
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--server-id=184054", "--binlog-row-image=FULL"]
    environment:
      MYSQL_DATABASE: maBase
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./service-messaging/mysql-init/grant-replication.sql:/docker-entrypoint-initdb.d/grant-replication.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devuser", "-pdevpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: "prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./service-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./service-monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: "grafana"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./service-monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./service-monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: "alertManager"
    ports:
      - "9093:9093"
    volumes:
      - ./service-monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./service-monitoring/alertmanager/discord_webhook_url:/etc/alertmanager/discord_webhook_url:ro
    networks:
      - monitoring-net

  influxdb:
    image: influxdb:1.8
    container_name: "influxDb"
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: jmeter
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    networks:
      - monitoring-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: "kafka"
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT (9092) : accès interne depuis les containers du réseau monitoring-net
      # EXTERNAL (9094) : accès depuis la machine hôte (dev local hors Docker)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - monitoring-net

  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: "kafka-connect"
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: outbox-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
      db-identite:
        condition: service_healthy
    networks:
      - monitoring-net

  # Enregistre les connecteurs outbox (identite, profil) au démarrage — même
  # esprit que le provisioning automatique de Grafana : `docker compose up`
  # suffit, aucune étape manuelle.
  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: "kafka-connect-init"
    entrypoint: ["/bin/sh", "/scripts/register-connectors.sh"]
    volumes:
      - ./service-messaging/debezium:/connectors:ro
      - ./service-messaging/debezium/register-connectors.sh:/scripts/register-connectors.sh:ro
    depends_on:
      - kafka-connect
    networks:
      - monitoring-net

  akhq:
    image: tchiotludo/akhq:latest
    container_name: "akhq"
    ports:
      - "8081:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - monitoring-net

  jmeter:
    platform: linux/amd64
    container_name: "jmeter"
    image: justb4/jmeter:latest
    entrypoint: [ "/bin/sh", "/scripts/run-test.sh" ]
    environment:
      TEST_PLAN: ${TEST_PLAN:-profil-api-load-test.jmx}
    volumes:
      - ./service-load-testing/jmeter/run-test.sh:/scripts/run-test.sh:ro
      - ./service-load-testing/jmeter/test-plans:/test-plans
      - ./service-load-testing/jmeter/results:/results
      - ./service-load-testing/jmeter/reports:/reports
    depends_on:
      - app
      - influxdb
    networks:
      - monitoring-net
    profiles:
      - testing

networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus_data:
