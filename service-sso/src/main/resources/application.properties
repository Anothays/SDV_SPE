spring.application.name=service-sso
# 8082 : 8080 est pris par service-role-manager, 8081 par AKHQ
server.port=8082

# ===============================
# DATASOURCE MYSQL
# ===============================
# En local : container db (base "sso", même serveur MySQL que service-role-manager).
# En Docker : surcharge par SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:mysql://localhost:3306/sso
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# METRIQUES
# ===============================
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===============================
# KAFKA
# ===============================
# En local : listener EXTERNAL du container Kafka.
# En Docker : surcharge par SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Pas de type headers : le nom de classe Java ne doit pas fuiter vers les consommateurs
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Producteur idempotent + acks=all (spec §6)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.admin.fail-fast=false

# ===============================
# JWT
# ===============================
jwt.private-key-location=classpath:keys/dev-private.pem
