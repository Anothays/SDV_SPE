# Tests autonomes : H2 en mode MySQL, pas de broker Kafka requis
spring.datasource.url=jdbc:h2:mem:profil;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.listener.auto-startup=false
spring.kafka.admin.fail-fast=false

# Mêmes sérialiseurs qu'en prod (application.properties principal) : le
# KafkaTemplate<String, Object> auto-configuré (utilisé par le DLT recoverer
# et par PlayerRegisteredFlowIT) doit produire du JSON, pas du String brut.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=mademo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.dto
