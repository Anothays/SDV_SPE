# ===============================
# DATASOURCE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/role_manager
spring.datasource.username=devuser
spring.datasource.password=devpassword

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.application.name=service-role-manager
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# POOL DE CONNEXIONS (Hikari)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# METRIQUES
# ===============================
# Publie les buckets d'histogramme des requetes HTTP (necessaire au calcul
# du p99 par Prometheus, utilise par l'alerte HighLatencyP99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===============================
# KAFKA
# ===============================
# En local : listener EXTERNAL du container Kafka.
# En Docker : surcharge par SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 (docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9094

# Producteur : cle String, valeur serialisee en JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consommateur : deserialisation JSON vers les DTO locaux (players.registered, telemetrie)
spring.kafka.consumer.group-id=role-manager
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer autour du JsonDeserializer : une valeur illisible devient
# une exception traitable par l'error handler (skip apres retries) au lieu de bloquer
# la partition en rejeu infini au poll (constate en e2e sur telemetry.player.action).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# TelemetryEventProducer emet le header __TypeId__ de TelemetryEventDto (application.dto)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nebula.rolemanager.application.dto

# ===============================
# LOGGING SQL (optionnel)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
